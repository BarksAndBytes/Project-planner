[package]
name = "work-dashboard"
version = "0.1.0"
description = "Personal project dashboard with direct device-to-device sync"
authors = ["Scott Lamoureux"]
license = "MIT"
repository = "https://github.com/BarksAndBytes/project-planner"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "work_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Kept deliberately small (security checklist item 3). Exact versions are
# pinned by Cargo.lock, which is committed after the first build.
tauri = { version = "2", features = [] }
# Data encryption at rest: XChaCha20-Poly1305 from RustCrypto.
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Noise protocol for the encrypted device-to-device sync pipe.
snow = "0.9"
# QR codes for the network check and device pairing (SVG output only).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Official Tauri plugin: scans QR codes with the phone camera.
tauri-plugin-barcode-scanner = "2"

[target.'cfg(windows)'.dependencies]
# Windows Data Protection API (data key) and SendInput (opens Windows voice typing).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
