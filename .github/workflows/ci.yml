name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript tests (model, store, themes contrast, static security scan)
        run: .github/scripts/run-logged.sh npm test
      - name: Rust storage tests (std only)
        run: |
          rustc --edition 2021 --test src-tauri/src/storage.rs -o "$RUNNER_TEMP/storage_test"
          "$RUNNER_TEMP/storage_test"

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Clippy
        shell: bash
        run: cd src-tauri && ../.github/scripts/run-logged.sh cargo clippy --all-targets -- -D warnings
      - name: Build
        shell: bash
        run: .github/scripts/run-logged.sh npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: work-dashboard-windows-unsigned
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm install
      - name: Build
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $NDK_HOME"
          .github/scripts/run-logged.sh npx tauri android init --ci
          .github/scripts/prepare-android.sh
          .github/scripts/run-logged.sh npx tauri android build --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  # Test builds are signed with the real release key, so a phone can move
  # from test builds to Store/GitHub releases without uninstalling (which
  # would delete that phone's data). Pushes only: pull requests never get
  # secrets. This job runs no npm or cargo; it only runs apksigner.
  sign-android:
    name: Sign Android APK
    if: github.event_name == 'push'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: apk
      - name: Sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || '55:71:21:B2:6E:5E:FF:D7:FC:2F:93:F9:06:98:70:63:CA:59:CF:D6:6D:DC:51:41:B2:16:1A:2F:26:0C:03:6A' }}
        run: |
          find apk -mindepth 2 -name '*-unsigned.apk' -exec mv {} apk/ \;
          .github/scripts/sign-apk.sh apk
      - uses: actions/upload-artifact@v4
        with:
          name: work-dashboard-android
          path: apk/*-signed.apk
          if-no-files-found: error

  # Rolling pre-release with the newest test build, at fixed download links:
  #   .../releases/download/test-build/WorkDashboard-test.apk
  #   .../releases/download/test-build/WorkDashboard-test-x64.msi
  # Marked pre-release, so it never shows as the "Latest" release.
  test-build-release:
    name: Publish test build
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [windows, sign-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: test-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Collect files
        run: |
          mkdir dist
          cp out/work-dashboard-android/*-signed.apk dist/WorkDashboard-test.apk
          cp out/work-dashboard-windows-unsigned/*.msi dist/WorkDashboard-test-x64.msi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          short="${GITHUB_SHA:0:7}"
          msg="$(printf '%s' "$COMMIT_MSG" | head -1)"
          notes=$(cat <<EOF
          Newest test build from \`$BRANCH\` at commit $short: $msg

          - **Android:** \`WorkDashboard-test.apk\`, signed with the release key. Installs over earlier test builds and keeps your data.
          - **Windows:** \`WorkDashboard-test-x64.msi\`, unsigned. Windows warns: More info, then Run anyway.

          Built $(date -u '+%Y-%m-%d %H:%M UTC'). Replaced on every push. For testing only.
          EOF
          )
          gh release delete test-build -R "$REPO" --cleanup-tag -y 2>/dev/null || true
          gh release create test-build -R "$REPO" --prerelease --target "$GITHUB_SHA" \
            --title "Test build ($BRANCH @ $short)" --notes "$notes" dist/*
